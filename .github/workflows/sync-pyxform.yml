name: Sync pyxform upstream

on:
  schedule:
    # Poll every hour
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required by anthropics/claude-code-action to mint a GitHub token via OIDC.
  # Without this the action fails early with "Could not fetch an OIDC token".
  id-token: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Check for upstream changes
        id: check
        run: |
          cd pyxform
          CURRENT_SHA=$(git rev-parse HEAD)
          git fetch origin master
          UPSTREAM_SHA=$(git rev-parse origin/master)

          echo "current=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new changes in pyxform upstream."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New changes detected: $CURRENT_SHA -> $UPSTREAM_SHA"
            # Collect the diff summary for the Claude prompt
            DIFF_SUMMARY=$(git log --oneline "$CURRENT_SHA..$UPSTREAM_SHA")
            echo "diff_summary<<EOF" >> "$GITHUB_OUTPUT"
            echo "$DIFF_SUMMARY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing PR
        if: steps.check.outputs.changed == 'true'
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync-pyxform-${{ steps.check.outputs.upstream }}"
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR already exists for this SHA."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch and update submodule
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.skip == 'false'
        run: |
          BRANCH="sync-pyxform-${{ steps.check.outputs.upstream }}"
          git checkout -b "$BRANCH"

          cd pyxform
          git checkout ${{ steps.check.outputs.upstream }}
          cd ..

          git add pyxform
          git commit -m "chore: update pyxform submodule to ${{ steps.check.outputs.upstream }}"

      - name: Setup pnpm
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.skip == 'false'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code to translate changes
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.skip == 'false'
        timeout-minutes: 60
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pass the token explicitly so the action does not depend on the OIDC
          # exchange for GitHub access.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The pyxform git submodule has been updated from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.upstream }}.

            Here are the new upstream commits:
            ${{ steps.check.outputs.diff_summary }}

            Your task is to translate the upstream Python (pyxform) changes into this
            TypeScript port (`xlsxform/`). The TS codebase is NOT a line-for-line mirror of
            pyxform — it has its own module layout and its own test suite. Translate
            *behaviour*, not file structure. Follow these instructions carefully:

            1. Examine the full upstream diff (source AND tests):
               cd pyxform && git diff ${{ steps.check.outputs.current }}..${{ steps.check.outputs.upstream }} -- pyxform/ tests/

            2. Understand what actually changed. Separate observable behaviour changes
               (new features, bug fixes, error messages, error codes) from pure internal
               refactors (renamed symbols, reorganised constants). Prioritise the behaviour.

            3. For every upstream test that was added or modified, find the matching TS test
               under `xlsxform/tests/` (search for the scenario / error string — names are
               similar but not identical) and update it to assert the new behaviour. If a new
               upstream test has no TS counterpart, add one. Mirror the upstream assertions.

            4. Translate the source changes into `xlsxform/src/`:
               - Match the existing code style and patterns (use Read/Grep/Glob to find them).
               - Reuse the project's existing helpers, constants and error infrastructure
                 (e.g. the `ErrorCode` table in `src/errors.ts`) rather than inventing new ones.
               - Keep TypeScript strict mode happy; adapt Python idioms to idiomatic TypeScript.

            5. The xlsx package is fetched from the SheetJS CDN, which may be unreachable in CI.
               If `pnpm install` fails only on the xlsx tarball, install the rest and note it —
               parameter/parsing tests run from Markdown fixtures and do not need the xlsx binary.
               A pre-existing xlsx-version-sensitive test may fail in that situation; do not
               chase it if it is unrelated to your change.

            6. Iterate until ALL of the following pass (run from the repo root):
               - `pnpm --filter xlsxform run test` (all tests must pass — 100% compliance)
               - `pnpm --filter xlsxform run lint`
               - `pnpm --filter xlsxform run typecheck`
               - `pnpm --filter xlsxform run knip` (no unused exports, dependencies, or files)

            7. If knip reports unused exports or files introduced by the translation, remove
               them. If it reports pre-existing issues unrelated to your changes, leave them.

            8. Read each test failure carefully and fix the root cause; do not weaken an
               assertion just to make it pass. Keep iterating until everything is green.

            9. Do NOT modify `pyxform/`, `package.json`, `tsconfig.json`, `biome.json`, or
               `vitest.config.ts` unless absolutely necessary.

            10. When done, stage and commit your changes using a conventional commit message
                (feat, fix, refactor, etc.) that accurately reflects the upstream change.
                Do NOT use a generic message — read the upstream commits to determine the
                right type and a precise summary.
          claude_args: "--model claude-opus-4-8 --max-turns 80 --allowedTools Read,Edit,Write,Grep,Glob,Bash"

      - name: Verify translation
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.skip == 'false'
        run: |
          # Safety gate: never open a PR for a translation that does not pass the
          # project's own quality checks.
          pnpm --filter xlsxform run typecheck
          pnpm --filter xlsxform run lint
          pnpm --filter xlsxform run knip
          pnpm --filter xlsxform run test

      - name: Push branch and create PR
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync-pyxform-${{ steps.check.outputs.upstream }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Sync pyxform upstream (${{ steps.check.outputs.upstream }})" \
            --body "$(cat <<'EOF'
          ## Pyxform upstream sync

          Updates pyxform submodule and translates changes to TypeScript.

          **Previous SHA:** `${{ steps.check.outputs.current }}`
          **New SHA:** `${{ steps.check.outputs.upstream }}`

          ### Upstream commits
          ```
          ${{ steps.check.outputs.diff_summary }}
          ```

          ### Translation
          Changes were automatically translated from Python to TypeScript by Claude Code.

          > [!IMPORTANT]
          > Review the translated code carefully before merging.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --base main \
            --head "$BRANCH"
